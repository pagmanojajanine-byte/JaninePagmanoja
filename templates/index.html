
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Student API Interface</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f3e8ff, #e0c3fc);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 600px;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(80, 30, 120, 0.18);
        }

        h1 {
            text-align: center;
            color: #6b21a8;
            margin-bottom: 25px;
        }

        h2 {
            color: #7e22ce;
            margin-bottom: 15px;
        }

        button {
            background: #7e22ce;
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            transition: 0.3s;
        }

        button:hover {
            background: #581c87;
            transform: translateY(-2px);
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        #result,
        #gradeResult,
        #studentList {
            background: #faf5ff;
            border: 1px solid #e9d5ff;
            border-radius: 10px;
            padding: 18px;
            margin-top: 20px;
            color: #333;
            line-height: 1.8;
            overflow-wrap: anywhere;
        }

        #result:empty,
        #gradeResult:empty,
        #studentList:empty {
            display: none;
        }

        #studentList p {
            padding: 10px 0;
            border-bottom: 1px solid #e9d5ff;
        }

        #studentList p:last-child {
            border-bottom: none;
        }

        hr {
            border: none;
            border-top: 1px solid #e9d5ff;
            margin: 28px 0;
        }

        .greeting-section,
        .grade-section,
        .database-section {
            margin-top: 10px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid #d8b4fe;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #7e22ce;
            box-shadow: 0 0 5px rgba(126, 34, 206, 0.25);
        }

        #greeting {
            margin-top: 15px;
            color: #6b21a8;
            font-weight: bold;
        }

        .hint {
            color: #777;
            font-size: 13px;
            margin-bottom: 12px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 22px;
            }

            h1 {
                font-size: 24px;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Student API Interface</h1>

    <!-- Student Information API -->
    <section>
        <h2>Student Information</h2>

        <button onclick="loadStudent()">
            Load Student Information
        </button>

        <div id="result" aria-live="polite"></div>
    </section>

    <hr>

    <!-- Students from Database -->
    <section class="database-section">
        <h2>Students from Database</h2>

        <button onclick="loadStudents()">
            Load Students
        </button>

        <div id="studentList" aria-live="polite"></div>
    </section>

    <hr>

    <!-- Greeting API -->
    <section class="greeting-section">
        <h2>Greeting API</h2>

        <input
            type="text"
            id="nameInput"
            placeholder="Enter your first name"
        >

        <button onclick="sayHello()">Say Hello</button>

        <p id="greeting" aria-live="polite"></p>
    </section>

    <hr>

    <!-- Grade API -->
    <section class="grade-section">
        <h2>Grade Checker API</h2>

        <p class="hint">
            Enter a score to check your grade and remark.
            Accepted scores: 0–100.
        </p>

        <input
            type="number"
            id="scoreInput"
            placeholder="Enter your score (0–100)"
            min="0"
            max="100"
            step="any"
        >

        <button id="gradeButton" onclick="checkGrade()">
            Check Grade
        </button>

        <div id="gradeResult" aria-live="polite"></div>
    </section>

</div>

<script>
    // Load Student Information
    function loadStudent() {
        const result = document.getElementById('result');

        result.textContent = 'Loading student information...';

        fetch('/student')
            .then(response => {
                if (!response.ok) {
                    throw new Error('Failed to fetch student data');
                }
                return response.json();
            })
            .then(data => {
                result.replaceChildren();

                const fields = [
                    ['Student ID', data.student_id],
                    ['Name', data.name],
                    ['Program', data.program],
                    ['Year', data.year],
                    ['Section', data.section]
                ];

                fields.forEach(([label, value]) => {
                    const p = document.createElement('p');
                    const b = document.createElement('b');

                    b.textContent = label + ': ';
                    p.appendChild(b);
                    p.appendChild(
                        document.createTextNode(value ?? 'Not provided')
                    );

                    result.appendChild(p);
                });
            })
            .catch(error => {
                result.textContent =
                    'Unable to retrieve student data. Please try again.';
                console.error('Error:', error);
            });
    }

    // Load all students from the SQLite database
    function loadStudents() {
        const studentList = document.getElementById('studentList');

        studentList.textContent = 'Loading student records...';

        fetch('/students')
            .then(response => {
                if (!response.ok) {
                    throw new Error('Failed to fetch student records');
                }
                return response.json();
            })
            .then(data => {
                let output = '';

                if (data.length === 0) {
                    studentList.textContent =
                        'No student records found in the database.';
                    return;
                }

                data.forEach(student => {
                    output +=
                        '<p>' +
                        '<b>' + escapeHTML(student.student_id) + '</b> - ' +
                        escapeHTML(student.name) + ' | ' +
                        escapeHTML(student.program) + ' | Year ' +
                        escapeHTML(student.year) + ' | Section ' +
                        escapeHTML(student.section) +
                        '</p>';
                });

                studentList.innerHTML = output;
            })
            .catch(error => {
                studentList.textContent =
                    'Unable to retrieve student records.';
                console.error('Database API error:', error);
            });
    }

    // Safely display database values as text
    function escapeHTML(value) {
        return String(value ?? '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    // Greeting API
    function sayHello() {
        const name =
            document.getElementById('nameInput').value.trim();

        const greeting = document.getElementById('greeting');

        if (name === '') {
            greeting.textContent = 'Please enter your first name.';
            return;
        }

        greeting.textContent = 'Loading greeting...';

        fetch('/hello?name=' + encodeURIComponent(name))
            .then(response => {
                if (!response.ok) {
                    throw new Error('Failed to fetch greeting');
                }
                return response.json();
            })
            .then(data => {
                greeting.textContent =
                    data.message || 'Greeting received.';
            })
            .catch(error => {
                greeting.textContent = 'Unable to retrieve greeting.';
                console.error('Error:', error);
            });
    }

    // Grade API
    async function checkGrade() {
        const scoreInput = document.getElementById('scoreInput');
        const gradeResult = document.getElementById('gradeResult');
        const gradeButton = document.getElementById('gradeButton');

        const scoreText = scoreInput.value.trim();
        const score = Number(scoreText);

        if (
            scoreText === '' ||
            !Number.isFinite(score) ||
            score < 0 ||
            score > 100
        ) {
            gradeResult.textContent =
                'Please enter a valid score between 0 and 100.';
            return;
        }

        gradeButton.disabled = true;
        gradeResult.textContent = 'Checking grade...';

        try {
            const response = await fetch(
                '/grade?score=' + encodeURIComponent(score)
            );

            const data = await response.json();

            if (!response.ok) {
                throw new Error(
                    data.error || 'Failed to check grade.'
                );
            }

            gradeResult.replaceChildren();

            const scoreParagraph = document.createElement('p');
            const scoreLabel = document.createElement('b');

            scoreLabel.textContent = 'Score: ';
            scoreParagraph.appendChild(scoreLabel);
            scoreParagraph.appendChild(
                document.createTextNode(data.score + '/100')
            );

            const remarkParagraph = document.createElement('p');
            const remarkLabel = document.createElement('b');

            remarkLabel.textContent = 'Remark: ';
            remarkParagraph.appendChild(remarkLabel);
            remarkParagraph.appendChild(
                document.createTextNode(data.remark)
            );

            gradeResult.appendChild(scoreParagraph);
            gradeResult.appendChild(remarkParagraph);

        } catch (error) {
            gradeResult.textContent =
                'Unable to check grade. Make sure the Flask server is running.';
            console.error('Grade API error:', error);

        } finally {
            gradeButton.disabled = false;
        }
    }
</script>

</body>
</html>
